<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Día de las Flores Amarillas · 3D</title>
<style>
  :root{
    --gold:#ffd23f;
    --gold-soft:#ffb703;
    box-sizing:border-box;
  }
  html,body{
    margin:0; padding:0; height:100%;
    background:#020203;
    overflow:hidden;
    font-family:'Segoe UI', system-ui, sans-serif;
    touch-action:none;
  }
  #c{
    position:fixed; inset:0; z-index:0;
    display:block; width:100%; height:100%;
    cursor:grab;
  }
  #c:active{ cursor:grabbing; }

  .overlay{
    position:fixed; inset:0; z-index:2;
    pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding-top: calc(22px + env(safe-area-inset-top,0px));
    padding-bottom: calc(18px + env(safe-area-inset-bottom,0px));
  }
  h1.title{
    text-align:center;
    font-family:'Comic Sans MS','Segoe Print',cursive,sans-serif;
    font-size:clamp(1.15rem, 5.5vw, 2.1rem);
    color:#fffbe8;
    text-shadow:0 0 8px var(--gold), 0 0 22px var(--gold-soft), 0 0 40px rgba(255,183,3,.6);
    margin:0; padding:0 12px;
  }
  .hint{
    text-align:center;
    color:#ffe9b0cc;
    font-size:.78rem;
    letter-spacing:.02em;
    text-shadow:0 0 6px rgba(0,0,0,.8);
  }
  #loading{
    position:fixed; inset:0; z-index:5;
    background:#020203;
    display:flex; align-items:center; justify-content:center;
    color:#ffe9b0; font-size:.9rem;
    transition:opacity .6s ease;
  }
  #musicToggle{
    position:fixed; z-index:4;
    top: calc(14px + env(safe-area-inset-top,0px));
    right: calc(14px + env(safe-area-inset-right,0px));
    width:44px; height:44px;
    border-radius:50%;
    border:1px solid rgba(255,210,110,.5);
    background:rgba(10,8,2,.55);
    color:#ffe9b0;
    font-size:1.15rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(4px);
    box-shadow:0 0 12px rgba(255,183,3,.35);
    pointer-events:auto;
  }
  #musicToggle:active{ transform:scale(0.92); }
</style>
</head>
<body>

<div id="loading">Encendiendo estrellas… 🌻</div>
<canvas id="c"></canvas>

<div class="overlay">
  <h1 class="title">Feliz Día Del Amor Mi JULIETA 🌻</h1>
  <p class="hint" id="musicHint">Toca la pantalla para activar la música 🎵</p>
</div>

<button id="musicToggle" aria-label="Reproducir música" title="Reproducir música">🔈</button>
<audio id="bgMusic" loop preload="auto">
  <source src="musica.opus" type="audio/ogg; codecs=opus">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

  const frases = [
    "Contigo todo lugar es bonito",
    "Un girasol para quien me ilumina con su luz",
    "Gracias por quedarte siempre",
    "Tu risa le hace bien a mis días",
    "El amarillo también dice te quiero",
    "Haces que mi mundo brille",
    "Eres la casualidad mas bonita de mi vida",
    "Eres mi presente favorito y mi futuro soñado",
    "Quiero que sepas cuánto me importas",
    "Aquí siempre tienes un lugar para ti",
    "Hoy celebro tenerte en mi vida",
    "En tus ojos veo mi lugar feliz",
    "Eres el pensamiento que siempre me hace sonreír",
    "Contigo hasta lo simple brilla",
    "Un gracias que no necesita fecha",
    "Pétalos dorados solo para ti",
    "TE AMO",
    "TE AMO con un amor que va mas allá de las palabras",
    "Un ramo de gracias por estar ahí",
    "Apareciste cuando más te necesitaba",
    "Julieta, contigo el amor se siente fácil",
    "Cada latido mío tiene tu nombre",
    "Eres el corazón de mi historia favorita",
    "Contigo aprendí que el amor de verdad existe",
    "Mi corazón eligió el tuyo para siempre",
    "Julieta, eres mi persona favorita en este mundo",
    "Amarte es lo más fácil que he hecho",
    "Quiero mil vidas más para seguir amándote",
    "Tú y yo, un para siempre que apenas comienza",
    "Gracias por hacer latir mi corazón así"
  ];

  // ---------- background music ----------
  const bgMusic = document.getElementById('bgMusic');
  const musicToggle = document.getElementById('musicToggle');
  const musicHint = document.getElementById('musicHint');
  bgMusic.volume = 0.55;
  let musicPlaying = false;

  function updateMusicIcon(){
    musicToggle.textContent = musicPlaying ? '🔊' : '🔈';
    musicToggle.title = musicPlaying ? 'Pausar música' : 'Reproducir música';
    if(musicPlaying && musicHint) musicHint.style.display = 'none';
  }
  function playMusic(){
    bgMusic.play().then(()=>{
      musicPlaying = true;
      updateMusicIcon();
    }).catch(()=>{ /* el navegador requiere interacción del usuario */ });
  }
  function toggleMusic(){
    if(musicPlaying){
      bgMusic.pause();
      musicPlaying = false;
    } else {
      bgMusic.play().then(()=>{ musicPlaying = true; updateMusicIcon(); }).catch(()=>{});
      return;
    }
    updateMusicIcon();
  }
  musicToggle.addEventListener('click', toggleMusic);

  // intenta reproducir automáticamente; si el navegador lo bloquea,
  // arranca con el primer toque/clic del usuario en cualquier parte
  playMusic();
  ['pointerdown','touchstart','keydown'].forEach(evt=>{
    window.addEventListener(evt, function startOnce(){
      if(!musicPlaying) playMusic();
      window.removeEventListener(evt, startOnce);
    }, { once:true, passive:true });
  });

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x020203, 0.009);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);
  camera.position.set(0, 3, 38);

  // ---------- lights ----------
  scene.add(new THREE.AmbientLight(0x332200, 0.7));
  const goldLight = new THREE.PointLight(0xffcc55, 3, 80);
  goldLight.position.set(0, 4, 10);
  scene.add(goldLight);

  // ---------- starfield ----------
  function makeStars(count, spread, size, color, opacity){
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count*3);
    for(let i=0;i<count;i++){
      pos[i*3]   = (Math.random()-0.5)*spread;
      pos[i*3+1] = (Math.random()-0.5)*spread;
      pos[i*3+2] = (Math.random()-0.5)*spread;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color, size, transparent:true, opacity,
      blending: THREE.AdditiveBlending, depthWrite:false
    });
    return new THREE.Points(geo, mat);
  }
  const starsFar = makeStars(1800, 260, 0.55, 0xffffff, 0.75);
  const starsNear = makeStars(500, 140, 0.9, 0xfff2c9, 0.9);
  scene.add(starsFar, starsNear);

  // ---------- group that holds the whole "monument" ----------
  const world = new THREE.Group();
  scene.add(world);

  // ---------- canvas-texture helper ----------
  function canvasTexture(draw, w, h){
    const cnv = document.createElement('canvas');
    cnv.width = w; cnv.height = h;
    const ctx = cnv.getContext('2d');
    draw(ctx, w, h);
    const tex = new THREE.CanvasTexture(cnv);
    tex.needsUpdate = true;
    return tex;
  }

  // soft extra glow halo behind (kept subtle so the center stays dark)
  const glowTex = canvasTexture((ctx,w,h)=>{
    const g = ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    g.addColorStop(0,'rgba(255,190,90,0.45)');
    g.addColorStop(0.35,'rgba(255,160,50,0.15)');
    g.addColorStop(1,'rgba(255,160,50,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  }, 512,512);
  const glowMat = new THREE.SpriteMaterial({ map: glowTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.set(11,11,1);
  world.add(glow);

  // dark eclipse sphere
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(3, 48, 48),
    new THREE.MeshStandardMaterial({ color:0x05050a, roughness:0.9, metalness:0.1 })
  );
  world.add(sphere);
  // thin rim light sliver
  const rim = new THREE.Mesh(
    new THREE.SphereGeometry(3.02, 48, 48, 0, Math.PI*2, 0, Math.PI*0.55),
    new THREE.MeshBasicMaterial({ color:0xffcf6b, transparent:true, opacity:0.5 })
  );
  rim.rotation.x = -0.6;
  world.add(rim);

  // ---------- glowing dust ring (accretion-disk style) ----------
  function makeRingParticles(count, innerR, outerR, thickness){
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count*3);
    const col = new Float32Array(count*3);
    const colorInner = new THREE.Color(0xfff4c2);
    const colorMid   = new THREE.Color(0xffb347);
    const colorOuter = new THREE.Color(0xff5a3c);
    for(let i=0;i<count;i++){
      const t = Math.random();
      const r = innerR + Math.pow(t, 0.6)*(outerR-innerR);
      const ang = Math.random()*Math.PI*2;
      const rNorm = (r-innerR)/(outerR-innerR);
      const y = (Math.random()-0.5)*thickness*(1-rNorm*0.85);
      pos[i*3]   = Math.cos(ang)*r;
      pos[i*3+1] = y;
      pos[i*3+2] = Math.sin(ang)*r;

      const c = rNorm < 0.5
        ? colorInner.clone().lerp(colorMid, rNorm/0.5)
        : colorMid.clone().lerp(colorOuter, (rNorm-0.5)/0.5);
      col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color', new THREE.BufferAttribute(col,3));

    const dotTex = canvasTexture((ctx,w,h)=>{
      const g = ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
      g.addColorStop(0,'rgba(255,255,255,1)');
      g.addColorStop(0.4,'rgba(255,255,255,0.75)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    }, 32,32);

    const mat = new THREE.PointsMaterial({
      size:0.34, map:dotTex, vertexColors:true, transparent:true,
      blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.95
    });
    return new THREE.Points(geo, mat);
  }
  const ringParticles = makeRingParticles(13000, 3.6, 24, 4.4);
  world.add(ringParticles);

  // ---------- floating sunflowers (emoji sprites) ----------
  function emojiSprite(emoji, size){
    const tex = canvasTexture((ctx,w,h)=>{
      ctx.font = (h*0.8)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='rgba(255,183,3,0.9)';
      ctx.shadowBlur = h*0.15;
      ctx.fillText(emoji, w/2, h/2);
    }, 128,128);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false });
    const spr = new THREE.Sprite(mat);
    spr.scale.set(size,size,1);
    return spr;
  }

  const flowers = [];
  const flowerEmojis = ['🌻','🌼'];
  for(let i=0;i<26;i++){
    const spr = emojiSprite(flowerEmojis[i%2], 1.1 + Math.random()*1.3);
    const radius = 10 + Math.random()*16;
    const ang = Math.random()*Math.PI*2;
    spr.position.set(
      Math.cos(ang)*radius,
      (Math.random()-0.5)*16,
      Math.sin(ang)*radius
    );
    spr.userData = { baseY: spr.position.y, phase: Math.random()*Math.PI*2, speed: 0.4+Math.random()*0.6 };
    flowers.push(spr);
    world.add(spr);
  }

  // ---------- floating hearts (rising) ----------
  const hearts = [];
  const heartEmojis = ['❤️','💛','💕','💖','💗'];
  const HEART_TOP = 22, HEART_BOTTOM = -22;
  for(let i=0;i<24;i++){
    const spr = emojiSprite(heartEmojis[i % heartEmojis.length], 0.8 + Math.random()*0.9);
    const radius = 5 + Math.random()*20;
    const ang = Math.random()*Math.PI*2;
    spr.position.set(
      Math.cos(ang)*radius,
      HEART_BOTTOM + Math.random()*(HEART_TOP-HEART_BOTTOM),
      Math.sin(ang)*radius
    );
    spr.userData = {
      rise: 0.5 + Math.random()*0.9,
      drift: (Math.random()-0.5)*0.5,
      phase: Math.random()*Math.PI*2
    };
    hearts.push(spr);
    world.add(spr);
  }

  // ---------- floating message sprites ----------
  function textSprite(str){
    const w = 512, h = 128;
    const tex = canvasTexture((ctx,ww,hh)=>{
      ctx.clearRect(0,0,ww,hh);
      ctx.font = '600 40px "Segoe UI", sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='rgba(255,183,3,0.95)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#fff2c8';
      // simple wrap
      const words = str.split(' ');
      let line = '', lines = [];
      for(const word of words){
        const test = line + word + ' ';
        if(ctx.measureText(test).width > ww-30 && line){ lines.push(line); line = word+' '; }
        else line = test;
      }
      lines.push(line);
      const lh = 46;
      const startY = hh/2 - ((lines.length-1)*lh)/2;
      lines.forEach((l,i)=> ctx.fillText(l.trim(), ww/2, startY + i*lh));
    }, w, h);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false });
    const spr = new THREE.Sprite(mat);
    const scale = 5.5;
    spr.scale.set(scale, scale*(h/w), 1);
    return spr;
  }

  const messages = [];
  const shuffled = frases.slice().sort(()=>Math.random()-0.5);
  for(let i=0;i<shuffled.length;i++){
    const spr = textSprite(shuffled[i]);
    const radius = 13 + Math.random()*15;
    const ang = (i/shuffled.length)*Math.PI*2 + Math.random()*0.5;
    spr.position.set(
      Math.cos(ang)*radius,
      (Math.random()-0.5)*18,
      Math.sin(ang)*radius
    );
    spr.userData = { baseY: spr.position.y, phase: Math.random()*Math.PI*2, speed: 0.3+Math.random()*0.4 };
    messages.push(spr);
    world.add(spr);
  }

  // ---------- interaction: drag to orbit ----------
  let dragging=false, lastX=0, lastY=0;
  let rotY=0.35, rotX=0.08, velY=0.0009;
  function onDown(x,y){ dragging=true; lastX=x; lastY=y; }
  function onMove(x,y){
    if(!dragging) return;
    const dx=x-lastX, dy=y-lastY;
    rotY += dx*0.0045;
    rotX += dy*0.0025;
    rotX = Math.max(-0.6, Math.min(0.6, rotX));
    lastX=x; lastY=y;
  }
  function onUp(){ dragging=false; }

  canvas.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY));
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; onDown(t.clientX,t.clientY); }, {passive:true});
  canvas.addEventListener('touchmove', e=>{ const t=e.touches[0]; onMove(t.clientX,t.clientY); }, {passive:true});
  canvas.addEventListener('touchend', onUp);

  // ---------- resize ----------
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- animate ----------
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    if(!dragging) rotY += velY;

    camera.position.x = Math.sin(rotY) * 38 * Math.cos(rotX);
    camera.position.z = Math.cos(rotY) * 38 * Math.cos(rotX);
    camera.position.y = 3 + Math.sin(rotX)*18;
    camera.lookAt(0,0,0);

    ringParticles.rotation.y += 0.0006;
    sphere.rotation.y += 0.001;
    starsFar.rotation.y += 0.00006;
    starsNear.rotation.y -= 0.00009;

    flowers.forEach(f=>{
      f.position.y = f.userData.baseY + Math.sin(t*f.userData.speed + f.userData.phase)*0.6;
    });
    hearts.forEach(h=>{
      h.position.y += h.userData.rise * 0.012;
      h.position.x += Math.sin(t*0.5 + h.userData.phase) * h.userData.drift * 0.02;
      if(h.position.y > HEART_TOP) h.position.y = HEART_BOTTOM;
    });
    messages.forEach(m=>{
      m.position.y = m.userData.baseY + Math.sin(t*m.userData.speed + m.userData.phase)*0.8;
    });

    renderer.render(scene, camera);
  }
  animate();

  const loading = document.getElementById('loading');
  requestAnimationFrame(()=> requestAnimationFrame(()=>{
    loading.style.opacity='0';
    setTimeout(()=> loading.remove(), 650);
  }));

})();
</script>
</body>
</html>
